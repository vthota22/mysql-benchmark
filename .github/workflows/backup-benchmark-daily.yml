# Scheduled backup benchmark — GitHub Actions orchestrates; droplets execute the harness.
#
# Required GitHub repository secrets:
#   BENCHMARK_SSH_PRIVATE_KEY   — private key with SSH access to all benchmark droplets
#
# Required repository variables (Settings → Secrets and variables → Actions → Variables):
#   BENCHMARK_REMOTE_REPO       — e.g. /root/mysql-benchmark
#   BACKUP_DROPLET_MAP          — name:host pairs (preferred); falls back to BENCHMARK_DROPLET_MAP
#
# Optional variables:
#   BENCHMARK_DROPLET_HOST      — fallback single droplet if maps unset
#   BENCHMARK_DROPLET_USER      — default: root
#   BENCHMARK_DROPLET_GIT_BRANCH — default: main
#
# Each droplet must have backup-benchmarking/benchmark.conf (gitignored) with
# MySQL connection details and (for profiling) KUBECONFIG_PATH / KUBE_NAMESPACE.

name: Backup Benchmark (daily)

on:
  schedule:
    # Once per day (10:00 UTC) — staggered after failover 06:00 and scaling 08:00.
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      git_branch:
        description: "Git branch to sync on droplet before run (empty = main)"
        required: false
        default: ""
      droplet:
        description: "Run only this droplet name from BACKUP_DROPLET_MAP (empty = all)"
        required: false
        default: ""

concurrency:
  group: backup-benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Build droplet matrix
        id: set-matrix
        env:
          DROPLET_MAP: ${{ vars.BACKUP_DROPLET_MAP || vars.BENCHMARK_DROPLET_MAP }}
          DROPLET_HOST: ${{ vars.BENCHMARK_DROPLET_HOST }}
          FILTER_NAME: ${{ inputs.droplet }}
        run: |
          set -euo pipefail
          raw="${DROPLET_MAP:-}"
          if [[ -z "${raw}" && -n "${DROPLET_HOST:-}" ]]; then
            raw="default:${DROPLET_HOST}"
            echo "Map unset — using single BENCHMARK_DROPLET_HOST"
          fi
          if [[ -z "${raw}" ]]; then
            echo "ERROR: set BACKUP_DROPLET_MAP or BENCHMARK_DROPLET_MAP (or BENCHMARK_DROPLET_HOST)"
            exit 1
          fi

          python3 <<'PY'
          import json, os, re, sys

          raw = os.environ.get("DROPLET_MAP", "")
          filt = os.environ.get("FILTER_NAME", "").strip()

          entries = []
          seen_hosts = set()
          for chunk in raw.split(","):
              chunk = chunk.strip()
              if not chunk:
                  continue
              if ":" in chunk:
                  name, host = chunk.split(":", 1)
              else:
                  name = host = chunk
              name = name.strip()
              host = host.strip()
              if not host:
                  continue
              if not re.match(r"^[A-Za-z0-9][A-Za-z0-9._-]*$", name):
                  print(f"ERROR: invalid droplet name '{name}'", file=sys.stderr)
                  sys.exit(1)
              if host in seen_hosts:
                  continue
              seen_hosts.add(host)
              entries.append({"name": name, "host": host})

          if filt:
              entries = [e for e in entries if e["name"] == filt]
              if not entries:
                  print(f"ERROR: droplet '{filt}' not found in map", file=sys.stderr)
                  sys.exit(1)

          if not entries:
              print("ERROR: no droplets parsed from map", file=sys.stderr)
              sys.exit(1)

          matrix = {"include": entries}
          print(json.dumps(matrix))
          print(f"Matrix: {len(entries)} droplet(s): " + ", ".join(f"{e['name']}@{e['host']}" for e in entries))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"matrix={json.dumps(matrix)}\n")
          PY

  backup-benchmark:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    concurrency:
      group: backup-${{ matrix.name }}-${{ github.workflow }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Validate required configuration
        run: |
          set -euo pipefail
          if [[ -z "${{ secrets.BENCHMARK_SSH_PRIVATE_KEY }}" ]]; then
            echo "ERROR: missing secret BENCHMARK_SSH_PRIVATE_KEY"
            exit 1
          fi
          if [[ -z "${{ vars.BENCHMARK_REMOTE_REPO }}" ]]; then
            echo "ERROR: missing variable BENCHMARK_REMOTE_REPO"
            exit 1
          fi
          echo "Droplet: ${{ matrix.name }} @ ${{ matrix.host }}"

      - name: Install SSH key
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ci-ssh"
          chmod 700 "${RUNNER_TEMP}/ci-ssh"
          KEY_FILE="${RUNNER_TEMP}/ci-ssh/benchmark_ci_key"
          printf '%s\n' "${BENCHMARK_SSH_PRIVATE_KEY}" > "${KEY_FILE}"
          sed -i 's/\r$//' "${KEY_FILE}"
          if [[ "$(tail -c1 "${KEY_FILE}" | wc -l)" -eq 0 ]]; then
            printf '\n' >> "${KEY_FILE}"
          fi
          chmod 600 "${KEY_FILE}"
          ssh-keygen -y -f "${KEY_FILE}" > "${KEY_FILE}.pub"
          echo "SSH key OK for ${{ matrix.name }}"
          ssh-keygen -lf "${KEY_FILE}.pub"
        env:
          BENCHMARK_SSH_PRIVATE_KEY: ${{ secrets.BENCHMARK_SSH_PRIVATE_KEY }}

      - name: Run backup benchmark on droplet
        env:
          CI_SSH_KEY_FILE: ${{ runner.temp }}/ci-ssh/benchmark_ci_key
          BENCHMARK_DROPLET_NAME: ${{ matrix.name }}
          BENCHMARK_DROPLET_HOST: ${{ matrix.host }}
          BENCHMARK_DROPLET_USER: ${{ vars.BENCHMARK_DROPLET_USER || 'root' }}
          BENCHMARK_REMOTE_REPO: ${{ vars.BENCHMARK_REMOTE_REPO }}
          BENCHMARK_REMOTE_BENCHMARK_CONF: backup-benchmarking/benchmark.conf
          BENCHMARK_DROPLET_GIT_BRANCH: ${{ inputs.git_branch != '' && inputs.git_branch || vars.BENCHMARK_DROPLET_GIT_BRANCH || 'main' }}
          CI_GIT_SYNC: "1"
          CI_ARTIFACTS_DIR: ${{ github.workspace }}/ci-artifacts/${{ matrix.name }}
        run: |
          set -euo pipefail
          echo "=== ${{ matrix.name }} @ ${{ matrix.host }} ==="
          chmod +x scripts/ci_backup_benchmark.sh scripts/backup_run_ctl.sh
          if command -v stdbuf >/dev/null 2>&1; then
            stdbuf -oL -eL ./scripts/ci_backup_benchmark.sh
          else
            ./scripts/ci_backup_benchmark.sh
          fi

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-report-${{ matrix.name }}-${{ github.run_id }}
          path: ci-artifacts/${{ matrix.name }}/
          retention-days: 90
          if-no-files-found: warn

      - name: Summarize
        if: success()
        run: |
          echo "### ${{ matrix.name }} — Backup KPIs" >> "${GITHUB_STEP_SUMMARY}"
          csv="$(find "ci-artifacts/${{ matrix.name }}" -name benchmark_with_backup_status.csv 2>/dev/null | head -1)"
          if [[ -n "${csv}" ]]; then
            echo "CSV: \`${csv}\`" >> "${GITHUB_STEP_SUMMARY}"
            echo '```csv' >> "${GITHUB_STEP_SUMMARY}"
            head -5 "${csv}" >> "${GITHUB_STEP_SUMMARY}"
            echo '```' >> "${GITHUB_STEP_SUMMARY}"
          fi
          timing="$(find "ci-artifacts/${{ matrix.name }}" -name run_timing.env 2>/dev/null | head -1)"
          if [[ -n "${timing}" ]]; then
            echo "Run timing:" >> "${GITHUB_STEP_SUMMARY}"
            echo '```' >> "${GITHUB_STEP_SUMMARY}"
            cat "${timing}" >> "${GITHUB_STEP_SUMMARY}"
            echo '```' >> "${GITHUB_STEP_SUMMARY}"
          fi
          report="$(find "ci-artifacts/${{ matrix.name }}" -name backup_benchmark_report.html 2>/dev/null | head -1)"
          if [[ -n "${report}" ]]; then
            echo "Report: \`${report}\`" >> "${GITHUB_STEP_SUMMARY}"
          fi
          echo "Artifact: backup-report-${{ matrix.name }}-${{ github.run_id }}" >> "${GITHUB_STEP_SUMMARY}"
