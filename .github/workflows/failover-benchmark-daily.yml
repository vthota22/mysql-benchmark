# Scheduled failover benchmark — GitHub Actions orchestrates; droplet executes the harness.
#
# Required GitHub repository secrets:
#   BENCHMARK_SSH_PRIVATE_KEY   — private key with SSH access to the benchmark droplet
#
# Optional repository variables (Settings → Secrets and variables → Actions → Variables):
#   BENCHMARK_DROPLET_HOST        — overrides ci/benchmark-target.conf
#   BENCHMARK_DROPLET_USER        — default: root
#   BENCHMARK_REMOTE_REPO         — default: /root/mysql-benchmark
#   BENCHMARK_DROPLET_GIT_BRANCH  — branch to git pull on droplet before run (e.g. main_2)
#
# One-time droplet setup (not done by this workflow):
#   git clone <repo> /root/mysql-benchmark && cd /root/mysql-benchmark && ./setup_benchmark.sh
#   cp benchmark.conf.example benchmark.conf  # fill credentials + failover settings
#   prepare TPC-C data once (SKIP_PREPARE=1 for daily runs)

name: Daily Failover Benchmark

on:
  schedule:
    # 02:00 UTC daily — adjust for your timezone / cluster maintenance windows
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      git_branch:
        description: "Git branch to sync on droplet before run (empty = main_2)"
        required: false
        default: ""

concurrency:
  group: failover-benchmark
  cancel-in-progress: false

jobs:
  failover-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Load CI target config (optional)
        run: |
          if [[ -f ci/benchmark-target.conf ]]; then
            echo "Using ci/benchmark-target.conf"
          else
            echo "No ci/benchmark-target.conf — using repository variables / workflow defaults"
          fi

      - name: Validate required configuration
        run: |
          set -euo pipefail
          missing=0
          if [[ -z "${{ secrets.BENCHMARK_SSH_PRIVATE_KEY }}" ]]; then
            echo "ERROR: missing secret BENCHMARK_SSH_PRIVATE_KEY"
            missing=1
          fi
          if [[ -z "${{ vars.BENCHMARK_DROPLET_HOST }}" ]]; then
            echo "ERROR: missing variable BENCHMARK_DROPLET_HOST"
            missing=1
          fi
          if [[ -z "${{ vars.BENCHMARK_REMOTE_REPO }}" ]]; then
            echo "ERROR: missing variable BENCHMARK_REMOTE_REPO (e.g. /root/mysql-benchmark)"
            missing=1
          fi
          if [[ "${missing}" -ne 0 ]]; then
            exit 1
          fi
          echo "Required secrets/variables present."

      - name: Install SSH key
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ci-ssh"
          chmod 700 "${RUNNER_TEMP}/ci-ssh"
          # Write multiline secret to file (more reliable than passing via env to bash).
          printf '%s\n' "${BENCHMARK_SSH_PRIVATE_KEY}" > "${RUNNER_TEMP}/ci-ssh/benchmark_ci_key"
          chmod 600 "${RUNNER_TEMP}/ci-ssh/benchmark_ci_key"
          if [[ ! -s "${RUNNER_TEMP}/ci-ssh/benchmark_ci_key" ]]; then
            echo "ERROR: SSH key file is empty after write"
            exit 1
          fi
          ssh-keygen -y -f "${RUNNER_TEMP}/ci-ssh/benchmark_ci_key" > "${RUNNER_TEMP}/ci-ssh/benchmark_ci_key.pub"
          echo "SSH key installed for CI ($(wc -c < "${RUNNER_TEMP}/ci-ssh/benchmark_ci_key") bytes)"
          echo "Public key fingerprint:"
          ssh-keygen -lf "${RUNNER_TEMP}/ci-ssh/benchmark_ci_key.pub"
        env:
          BENCHMARK_SSH_PRIVATE_KEY: ${{ secrets.BENCHMARK_SSH_PRIVATE_KEY }}

      - name: Run failover benchmark on droplet
        env:
          CI_SSH_KEY_FILE: ${{ runner.temp }}/ci-ssh/benchmark_ci_key
          BENCHMARK_DROPLET_HOST: ${{ vars.BENCHMARK_DROPLET_HOST }}
          BENCHMARK_DROPLET_USER: ${{ vars.BENCHMARK_DROPLET_USER || 'root' }}
          BENCHMARK_REMOTE_REPO: ${{ vars.BENCHMARK_REMOTE_REPO }}
          BENCHMARK_DROPLET_GIT_BRANCH: ${{ inputs.git_branch != '' && inputs.git_branch || vars.BENCHMARK_DROPLET_GIT_BRANCH || 'main_2' }}
          CI_GIT_SYNC: "1"
          CI_ARTIFACTS_DIR: ${{ github.workspace }}/ci-artifacts
        run: |
          set -euo pipefail
          echo "CI_GIT_SYNC=${CI_GIT_SYNC} (always enabled)"
          echo "BENCHMARK_DROPLET_HOST=${BENCHMARK_DROPLET_HOST}"
          echo "BENCHMARK_DROPLET_USER=${BENCHMARK_DROPLET_USER:-root}"
          echo "BENCHMARK_REMOTE_REPO=${BENCHMARK_REMOTE_REPO}"
          echo "BENCHMARK_DROPLET_GIT_BRANCH=${BENCHMARK_DROPLET_GIT_BRANCH}"
          echo "CI_SSH_KEY_FILE=${CI_SSH_KEY_FILE}"
          test -f "${CI_SSH_KEY_FILE}" && echo "SSH key file: OK ($(wc -c < "${CI_SSH_KEY_FILE}") bytes)" || {
            echo "SSH key file: MISSING"
            exit 1
          }
          chmod +x scripts/ci_failover_benchmark.sh
          # stdbuf -oL: line-buffered logs so GHA shows progress while polling
          if command -v stdbuf >/dev/null 2>&1; then
            stdbuf -oL -eL ./scripts/ci_failover_benchmark.sh
          else
            ./scripts/ci_failover_benchmark.sh
          fi

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failover-report-${{ github.run_id }}
          path: |
            ci-artifacts/
          retention-days: 90
          if-no-files-found: warn

      - name: Summarize KPIs
        if: success()
        run: |
          kpi="$(find ci-artifacts -name failover_kpi.csv | head -1)"
          if [[ -n "${kpi}" ]]; then
            echo "### Failover KPIs" >> "${GITHUB_STEP_SUMMARY}"
            echo '```csv' >> "${GITHUB_STEP_SUMMARY}"
            head -20 "${kpi}" >> "${GITHUB_STEP_SUMMARY}"
            echo '```' >> "${GITHUB_STEP_SUMMARY}"
          fi
          report="$(find ci-artifacts -name failover_report.html | head -1)"
          if [[ -n "${report}" ]]; then
            echo "HTML report saved to workflow artifacts: ${report}" >> "${GITHUB_STEP_SUMMARY}"
          fi
